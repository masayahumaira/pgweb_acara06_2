<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS - Toponimi Awesome Markers</title>

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- CSS Icons (Bootstrap Icons, FontAwesome, Awesome-Markers) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css">

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/" target="_blank"><i
                                class="bi bi-link-45deg"></i> SV UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <th style="width: 25%;">Nama</th>
                            <td>Masaya Humaira Swandani</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/557186/SV/26120</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>A</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalTitle">Informasi Kecamatan</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3195878, 123.0125427], 13);

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // Map Panes
        map.createPane('jumlah_penduduk');
        map.getPane('jumlah_penduduk').style.zIndex = 300;

        map.createPane('jalan');
        map.getPane('jalan').style.zIndex = 400;

        // ========================================================
        // 1. GeoJSON Point Toponimi (Dengan Awesome Markers)
        // ========================================================
        var toponimi = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                var markerIcon = "location-dot"; // Ikon default
                var markerColor = "blue";        // Warna default

                // Cek atribut NAMA_UNSUR dari GeoJSON
                var unsur = feature.properties.NAMA_UNSUR;

                if (unsur === "Gunung") {
                    markerIcon = "mountain";
                    markerColor = "red";
                } else if (unsur === "Tanjung") {
                    markerIcon = "map-pin";
                    markerColor = "orange";
                } else if (unsur === "Teluk") {
                    markerIcon = "water";
                    markerColor = "cadetblue";
                } else if (unsur === "Toponimi") {
                    markerIcon = "location-dot";
                    markerColor = "green";
                }

                var customIcon = L.AwesomeMarkers.icon({
                    icon: markerIcon,
                    prefix: 'fa',
                    markerColor: markerColor
                });

                return L.marker(latlng, { icon: customIcon });
            },

            onEachFeature: function (feature, layer) {
                // Handle jika kolom image bernilai null
                var imgTag = feature.properties.image ? "<img src='images/" + feature.properties.image + "' alt='' width='200'><br>" : "";

                var popup_content = imgTag +
                    "Nama: <b>" + feature.properties.TOPONIMI + "</b><br>" +
                    "Unsur: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1].toFixed(5) + ", " + feature.geometry.coordinates[0].toFixed(5);

                layer.on({
                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "top",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data);
            map.addLayer(toponimi);
        });

        // ========================================================
        // 2. GeoJSON Polyline Jalan
        // ========================================================
        var jalan = L.geoJSON(null, {
            pane: 'jalan',
            style: function (feature) {
                if (feature.properties.NAMA_UNSUR === "Jalan Propinsi" || feature.properties.NAMA_UNSUR === "Jalan Provinsi") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 3,
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Kabupaten") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 2,
                        dashArray: "10, 10",
                    };
                }
                if (feature.properties.NAMA_UNSUR === "Jalan Lain") {
                    return {
                        color: "red",
                        opacity: 1,
                        weight: 1,
                        dashArray: "6, 4",
                    };
                }
                return {
                    color: "red",
                    opacity: 1,
                    weight: 1,
                };
            },
            onEachFeature: function (feature, layer) {
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        });

        // ========================================================
        // 3. GeoJSON Polygon Jumlah Penduduk
        // ========================================================
        var jumlah_penduduk = L.geoJSON(null, {
            pane: 'jumlah_penduduk',
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.15,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.15,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.15,
                        fillColor: '#bd0026'
                    }
                }
            },
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        $("#pendudukModalTitle").html("Kecamatan " + feature.properties.WADMKC);
                        $("#pendudukModalBody").html(
                            "<table class='table table-striped'>" +
                            "<tr><th style='width: 40%;'>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + feature.properties.Penduduk + " Jiwa</td></tr>" +
                            "</table>"
                        );
                        var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("pendudukModal"));
                        modal.show();
                    },
                    mouseover: function (e) {
                        jumlah_penduduk.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
        });

        // ========================================================
        // 4. Control Layer
        // ========================================================
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var legenda_toponimi = "Toponimi<br>" +
            "<i class='fa-solid fa-mountain' style='color: #d9534f; margin-left: 18px; margin-right: 5px;'></i> Gunung<br>" +
            "<i class='fa-solid fa-map-pin' style='color: #f0ad4e; margin-left: 18px; margin-right: 5px;'></i> Tanjung<br>" +
            "<i class='fa-solid fa-water' style='color: #5bc0de; margin-left: 18px; margin-right: 5px;'></i> Teluk<br>" +
            "<i class='fa-solid fa-location-dot' style='color: #5cb85c; margin-left: 18px; margin-right: 5px;'></i> Toponimi (Lainnya)";

        var legenda_jalan = "Jalan<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='3'/></svg> Jalan Propinsi<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='2' stroke-dasharray='7, 4'/></svg> Jalan Kabupaten<br>" +
            "<svg width='20' height='6' style='vertical-align: middle; margin-left: 18px; margin-right: 5px;'><line x1='0' y1='3' x2='20' y2='3' stroke='red' stroke-width='1'stroke-dasharray='4, 4'/></svg> Jalan Lain";

        var legenda_penduduk = "Jumlah Penduduk<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #ffffb2; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> &le; 12.000 jiwa<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #fd8d3c; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> 12.001 - 24.000 jiwa<br>" +
            "<span style='display: inline-block; width: 15px; height: 15px; background-color: #bd0026; border: 1px solid #000; vertical-align: middle; margin-left: 18px; margin-right: 5px;'></span> &gt; 24.000 jiwa";

        var overlayMaps = {
            [legenda_toponimi]: toponimi,
            [legenda_jalan]: jalan,
            [legenda_penduduk]: jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
            imperial: false
        }).addTo(map);
    </script>
</body>

</html>
